---
# containerd restarts take every container on the node with them, including the
# static control-plane pods. The toolkit play runs one node at a time so the
# cluster never loses more than one node's containerd at once.
- name: Install NVIDIA Container Toolkit after Kubernetes
  hosts: kube_node
  serial: 1
  become: true
  vars:
    maas_gpustack_phase: toolkit
  roles:
    - maas-gpustack

- name: Install GPUStack
  hosts: kube_node
  become: true
  vars:
    maas_gpustack_phase: gpustack
  roles:
    - maas-gpustack

- name: Check GPUStack components
  hosts: kube_control_plane[0]
  become: true
  vars:
    maas_gpustack_phase: check
  roles:
    - maas-gpustack

- name: Print GPUStack access information
  hosts: kube_control_plane[0]
  become: true
  vars:
    maas_gpustack_phase: access
  roles:
    - maas-gpustack
