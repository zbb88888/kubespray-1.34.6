{{- if .Values.server.externalDatabaseURL }}
{{/*
The database URL carries the password, so it is kept out of server-config,
which is a ConfigMap readable by anyone with get access in this namespace.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-database
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "chart_labels" . | indent 4 }}
type: Opaque
stringData:
  GPUSTACK_DATABASE_URL: {{ .Values.server.externalDatabaseURL | quote }}
{{- end }}
