---
# The driver source is kube_node[0] by convention. Fail loudly here rather than
# letting 'ubuntu-drivers install' silently do nothing on a CPU-only node.
- name: Detect whether this node has an NVIDIA GPU
  ansible.builtin.include_tasks: nvidia-detect-gpu.yml

- name: Verify the driver source node has an NVIDIA GPU
  ansible.builtin.assert:
    that:
      - gpustack_node_has_gpu
    fail_msg: >-
      Driver source node {{ inventory_hostname }} reports no PCI vendor
      {{ gpustack_gpu_pci_vendor_id }} device. Set nvidia_driver_source, or
      order kube_node so that a GPU node comes first.

- name: Install Ubuntu driver discovery tools
  ansible.builtin.apt:
    name: ubuntu-drivers-common
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.distribution == 'Ubuntu'

- name: Check the source node driver
  ansible.builtin.command: nvidia-smi
  register: nvidia_source_smi
  changed_when: false
  failed_when: false
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - inventory_hostname == nvidia_driver_source

- name: Read the currently installed source-node driver package
  ansible.builtin.shell: |
    set -o pipefail
    dpkg-query -W -f='${db:Status-Abbrev} ${Package} ${Version}\n' 2>/dev/null |
      awk '$1 == "ii" && $2 ~ /^nvidia-driver-[0-9]+(-(open|server))?$/ {print $2, $3; exit}' || true
  args:
    executable: /bin/bash
  register: nvidia_existing_source_package
  changed_when: false
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - inventory_hostname == nvidia_driver_source

- name: Install the Ubuntu recommended driver on the source node
  ansible.builtin.command: ubuntu-drivers install
  register: nvidia_source_install
  changed_when: true
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - inventory_hostname == nvidia_driver_source
    - nvidia_existing_source_package.stdout | trim == ''

- name: Read the source node driver package
  ansible.builtin.shell: |
    set -o pipefail
    dpkg-query -W -f='${db:Status-Abbrev} ${Package} ${Version}\n' 2>/dev/null |
      awk '$1 == "ii" && $2 ~ /^nvidia-driver-[0-9]+(-(open|server))?$/ {print $2, $3; exit}' || true
  args:
    executable: /bin/bash
  register: nvidia_source_package
  changed_when: false
  failed_when: nvidia_source_package.stdout | trim == ''
  when: inventory_hostname == nvidia_driver_source

- name: Ensure the current source-node driver version is installed
  ansible.builtin.apt:
    name: >-
      {{ (nvidia_source_package.stdout | trim).split()[0] }}={{ (nvidia_source_package.stdout | trim).split()[1] }}
    state: present
    update_cache: false
    install_recommends: false
  register: nvidia_source_install_current
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - inventory_hostname == nvidia_driver_source

- name: Record source-node package changes as requiring reboot
  ansible.builtin.set_fact:
    nvidia_reboot_required_by_role: true
  when:
    - inventory_hostname == nvidia_driver_source
    - (nvidia_source_install.changed | default(false)) or (nvidia_source_install_current.changed | default(false))

- name: Read every installed driver package on the source node
  ansible.builtin.shell: |
    set -o pipefail
    dpkg-query -W -f='${db:Status-Abbrev} ${Package}\n' 2>/dev/null |
      awk '$1 == "ii" && $2 ~ /^nvidia-driver-[0-9]+(-(open|server))?$/ {print $2}' || true
  args:
    executable: /bin/bash
  register: nvidia_source_driver_packages
  changed_when: false
  when: inventory_hostname == nvidia_driver_source

- name: Fail when the source node has multiple installed driver packages
  ansible.builtin.fail:
    msg: >-
      Source node has multiple installed nvidia-driver-* packages:
      {{ nvidia_source_driver_packages.stdout_lines }}. Resolve manually
      before synchronizing the cluster.
  when:
    - inventory_hostname == nvidia_driver_source
    - nvidia_source_driver_packages.stdout_lines | length > 1

- name: Publish the selected driver package
  ansible.builtin.set_fact:
    nvidia_driver_package: "{{ (nvidia_source_package.stdout | trim).split()[0] }}"
    nvidia_driver_version: "{{ (nvidia_source_package.stdout | trim).split()[1] }}"
  when: inventory_hostname == nvidia_driver_source
