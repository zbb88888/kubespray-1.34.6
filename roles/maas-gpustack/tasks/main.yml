---
# 阶段编排见 GPU-Driver.md 第 7 节。pre-k8s 驱动流程：
#   source        第一台节点安装预编译驱动（不重启）
#   source_verify 第一台节点重启并验收（可重复执行，幂等）
#   rollout       其余节点逐台 安装 → 重启 → 验收（playbook 用 serial: 1）
#   verify        全集群只读终验
#   reboot        通用重启工具（单节点手动使用）
- name: Fail fast on an unknown phase
  ansible.builtin.fail:
    msg: >-
      maas_gpustack_phase 取值非法：{{ maas_gpustack_phase | default('未设置') }}。
      可选值：source、source_verify、rollout、reboot、verify、toolkit、
      gpustack、reset、check、access。
  when: >-
    maas_gpustack_phase | default('') not in
    ['source', 'source_verify', 'rollout', 'reboot', 'verify',
     'toolkit', 'gpustack', 'reset', 'check', 'access']

- name: Select the first Kubernetes node as the driver source
  ansible.builtin.set_fact:
    nvidia_driver_source: "{{ nvidia_driver_source | default(groups['kube_node'][0]) }}"

- name: Install the precompiled driver on the source node
  ansible.builtin.include_tasks: nvidia-preinstall-source.yml
  when: maas_gpustack_phase == 'source'

- name: Reboot the source node and verify it
  ansible.builtin.include_tasks: nvidia-preinstall-reboot-verify.yml
  when: maas_gpustack_phase == 'source_verify'

- name: Roll out to the remaining nodes one at a time
  ansible.builtin.include_tasks: nvidia-preinstall-rollout.yml
  when: maas_gpustack_phase == 'rollout'

- name: Reboot a node that still requires it
  ansible.builtin.include_tasks: nvidia-driver-update-reboot.yml
  when: maas_gpustack_phase == 'reboot'

- name: Verify the precompiled driver state
  ansible.builtin.include_tasks: nvidia-preinstall-verify.yml
  when: maas_gpustack_phase == 'verify'

- name: Install NVIDIA Container Toolkit
  ansible.builtin.include_tasks: nvidia-container-toolkit.yml
  when: maas_gpustack_phase == 'toolkit'

- name: Flush containerd handlers before GPUStack installation
  ansible.builtin.meta: flush_handlers
  when: maas_gpustack_phase == 'toolkit'

- name: Install GPUStack
  ansible.builtin.include_tasks: gpustack.yml
  when: maas_gpustack_phase == 'gpustack'

- name: Reset GPUStack for a clean reinstall
  ansible.builtin.include_tasks: gpustack-reset.yml
  when: maas_gpustack_phase == 'reset'

- name: Check GPUStack components
  ansible.builtin.include_tasks: check-gpustack.yml
  when: maas_gpustack_phase == 'check'

- name: Print GPUStack access information
  ansible.builtin.include_tasks: gpustack-access.yml
  when: maas_gpustack_phase == 'access'
