---
# dkms status and modinfo only report NVIDIA modules on a node that has a GPU,
# so a CPU-only kube_node would fail this phase for the wrong reason.
- name: Detect whether this node has an NVIDIA GPU
  ansible.builtin.include_tasks: nvidia-detect-gpu.yml

- name: Verify DKMS is the active NVIDIA module provider
  ansible.builtin.shell: |
    set -o pipefail
    dkms status | grep -E 'nvidia/'
    for module in nvidia nvidia_modeset nvidia_drm nvidia_uvm; do
      path=$(modinfo -F filename "$module" 2>/dev/null || true)
      case "$path" in
        */updates/dkms/*) ;;
        *) printf 'module=%s path=%s\n' "$module" "$path"; exit 1 ;;
      esac
    done
  args:
    executable: /bin/bash
  register: nvidia_dkms_module_check
  changed_when: false
  when: gpustack_node_has_gpu

- name: Verify no precompiled NVIDIA kernel modules are installed
  ansible.builtin.shell: |
    set -o pipefail
    dpkg-query -W -f='${db:Status-Abbrev} ${binary:Package}\n' 2>/dev/null |
      awk '$1 == "ii" { print $2 }' |
      grep '^linux-modules-nvidia-' && exit 1 || true
  args:
    executable: /bin/bash
  register: nvidia_precompiled_check
  changed_when: false
