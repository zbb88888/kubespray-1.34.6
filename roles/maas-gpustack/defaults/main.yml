---
# The bundled role chart is copied to the host where Helm runs.
gpustack_chart_path: /tmp/gpustack-chart
gpustack_values_path: /tmp/gpustack-values-maas-test.yaml
# Directory on the first control node where the check phase writes the bulky
# resource dumps that are too large to print.
gpustack_check_output_dir: /tmp/gpustack-check
gpustack_release_name: gpustack
gpustack_namespace: gpustack-system
gpustack_server_node: "{{ groups['kube_node'][0] }}"
gpustack_server_data_path: /var/lib/gpustack-server
# External HA PostgreSQL/MySQL URL. Required when server replicas > 1.
# Leave null to derive it from the CloudNativePG secret below, or set it
# explicitly to point at a database this cluster does not manage.
gpustack_external_database_url: null
# Secret generated by the maas-cloudnative-pg role. Its 'fqdn-uri' key holds
# the cross-namespace connection string. Set the name to null to fall back to
# the single-instance PostgreSQL bundled in the Server pod.
gpustack_database_secret_namespace: pg
gpustack_database_secret_name: pg-main-app
# Deployments created by the GPUStack operator, outside this Helm release.
# They use leader election: two replicas provide active/standby failover.
gpustack_control_plane_deployments:
  - csi-nfs-controller
  - csi-s3-controller
  - kueue-controller-manager
  - node-feature-discovery-gc
  - node-feature-discovery-master
gpustack_helm_wait: true
# First install pulls the GPUStack, Higress and operator images, then waits for
# the post-install hook Job. 10m proved too short on a cold node.
gpustack_helm_timeout: 20m
gpustack_worker_timeout: 10m
# The operator is applied by the chart's hook Job, outside Helm's wait.
gpustack_operator_timeout: 10m
# Kueue is installed by the operator after it becomes ready.
gpustack_kueue_retries: 60
gpustack_kueue_delay: 10
# The operator brings up NFD, Kueue, the CSI drivers and the device-manager
# DaemonSet after Helm returns. Retries cover Pods created mid-wait, which a
# single kubectl wait would never see.
gpustack_pod_ready_timeout: 5m
gpustack_pod_ready_retries: 6
gpustack_pod_ready_delay: 10
# The operator creates these controller Deployments asynchronously.
gpustack_control_plane_patch_retries: 60
gpustack_control_plane_patch_delay: 10
# Bundled dependency archive that must exist under files/gpustack-chart/charts/.
gpustack_chart_dependency_file: higress-core-2.1.9.tgz
# Pin all GPUStack images to the v2.3.0rc1 release. The chart appVersion is
# still 2.2.0, so image tags must remain explicit.
gpustack_image_tag: v2.3.0rc1
# v2.3.0rc1 embeds __operator_version__ = v0.8.6.
gpustack_operator_image_tag: v0.8.6
# v2.3.0rc1 depends on gpustack-higress-plugins 0.3.0.post8.
gpustack_higress_plugins_image_tag: 0.3.0.post8
# PCI vendor ID used for the GPUStack NVIDIA worker node label.
gpustack_gpu_pci_vendor_id: "10de"
# Higress names its gateway ports 'http2'/'https', so the access URL is derived
# from the port number rather than a port name.
gpustack_gateway_http_enabled: true
gpustack_gateway_https_enabled: true
gpustack_gateway_http_port: 80
gpustack_gateway_https_port: 443
# HTTPS defaults are for test environments only. Production deployments must
# replace all three values below and confirm the warning prompt with `yes`.
# The certificate and key are PEM contents, not file paths.
gpustack_server_ingress_hostname: gpustack.local
gpustack_server_ingress_tls_cert: null
gpustack_server_ingress_tls_key: null
gpustack_server_ingress_tls_dir: /root/gpustack-tls
nvidia_gpu_test_image: nvidia/cuda:13.0.0-base-ubuntu24.04
nvidia_gpu_test_namespace: default
nvidia_gpu_test_pod_name: nvidia-smi
nvidia_gpu_test_timeout: 180
# Substring the test pod's nvidia-smi output must contain. The default only
# proves an NVIDIA GPU was passed through; narrow it to an exact model such as
# 'NVIDIA GeForce RTX 4090' to assert specific hardware.
nvidia_gpu_test_expected_gpu: NVIDIA
# containerd restarts drop the node out of Ready until the kubelet reconnects.
nvidia_node_ready_timeout: 300s
# Demo intentionally follows the repository's current package. Pin this to an
# exact APT version when reproducible Toolkit upgrades are required.
# nvidia_container_toolkit_version: "1.17.8-1"

# --- NVIDIA 驱动安装方式（预编译路线）---
# 唯一权威说明见 GPU-Driver.md。本 role 固定使用 Ubuntu archive 的
# restricted 预编译内核模块：不安装 nvidia-dkms-*，不引入 NVIDIA 驱动源。
nvidia_driver_series: "595"
nvidia_driver_variant: "open"
# 内核 flavor 由运行内核推导：6.8.0-138-generic -> generic
nvidia_driver_flavor: "{{ ansible_kernel | regex_replace('^[^-]+-[^-]+-', '') }}"
# 用户态元包：nvidia-smi（nvidia-utils）、libcuda、persistenced 等
nvidia_driver_userspace_metapackage: >-
  nvidia-driver-{{ nvidia_driver_series }}-{{ nvidia_driver_variant }}
# 内核模块追踪包：跟随内核 ABI 升级，内核升级后自动指向新 ABI 的载荷包
nvidia_driver_module_tracker: >-
  linux-modules-nvidia-{{ nvidia_driver_series }}-{{ nvidia_driver_variant }}-{{ nvidia_driver_flavor }}
# 运行内核 ABI 的载荷包：切换期间保证当前运行内核仍有模块可用
nvidia_driver_module_payload: >-
  linux-modules-nvidia-{{ nvidia_driver_series }}-{{ nvidia_driver_variant }}-{{ ansible_kernel }}
# 必须不存在的 DKMS 构建包（nvidia-kernel-source-* 由用户态元包依赖，保留且不注册 DKMS）
nvidia_driver_dkms_packages:
  - "nvidia-dkms-{{ nvidia_driver_series }}-{{ nvidia_driver_variant }}"
# 用 apt 负向 pin 阻止依赖解析把 DKMS 构建包装回来
nvidia_driver_block_dkms: true
# 注意：apt 只读取 preferences.d 下 .pref 或无扩展名的文件，其它扩展名
# （如 .prefs）会被静默忽略。实测：.prefs 不生效，.pref 生效。
nvidia_driver_apt_pin_file: /etc/apt/preferences.d/nvidia-precompiled-only.pref
# 重启：默认逐台人工确认；无人值守场景设为 false
nvidia_reboot_confirm: true
nvidia_reboot_timeout: 900
